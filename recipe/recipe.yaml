schema_version: 1

context:
  version: "5.50.0"
  name: maxima

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://sourceforge.net/projects/maxima/files/Maxima-source/${{ version }}-source/${{ name }}-${{ version }}.tar.gz
  sha256: 0bc4b5e11fe153ef20b24a3a816b668ece5378cc738fa24ca426b62fd6d8fc37
  patches:
    # Patches from https://git.sagemath.org/sage.git/tree/build/pkgs/maxima/patches
    # Fixes a test failure that can occur when the install tree has been
    # relocated; see https://trac.sagemath.org/ticket/11348
    - patches/infodir.patch
    # Fixes a bug in matrix inversion that affects Sage; see
    # https://sourceforge.net/p/maxima/bugs/2596/
    - patches/matrixexp.patch
    # Disables a few tests that currently do not pass, see #14
    - patches/osx_tests.patch
    # Disable test that fails with ecl 16.1.2 in some setups
    - patches/rtest8.patch
    # Disable tests that started fails in 5.42.2
    - patches/disable_5_42_2_tests.diff

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - gnuconfig
    - libtool
    - make
    - texinfo
    - if: build_platform != target_platform
      then: ecl
  host:
    - ecl
    # ecl no longer run-exports libatomic_ops (its run_export is ignored in the
    # ecl feedstock), but its headers are still needed when ecl compiles
    # maxima's C sources.
    - libatomic_ops
    - readline
    - gmp
  run:
    - readline
    - ${{ pin_compatible('ecl', upper_bound='x.x.x') }}
    - gmp
  ignore_run_exports:
    by_name:
      - libatomic_ops
  run_constraints:
    - sagelib >=10.1

tests:
  - files:
      recipe:
        - run-from-ecl.lisp
    script:
      - maxima --version
      - ecl -shell run-from-ecl.lisp

about:
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Maxima is a system for the manipulation of symbolic and numerical expressions.
  homepage: http://maxima.sourceforge.net/
  repository: https://sourceforge.net/p/maxima/code/ci/master/tree/
  documentation: http://maxima.sourceforge.net/documentation.html

extra:
  recipe-maintainers:
    - embray
    - isuruf
    - saraedum
